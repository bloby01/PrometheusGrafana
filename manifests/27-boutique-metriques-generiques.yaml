# =============================================================================
# Patch metriques generiques + trace_id — boutique (sans rebuild)
# =============================================================================
# Remplace observability.py (metriques generiques http_requests_total /
# http_request_duration_seconds avec label `service`, + trace_id dans les logs)
# et les trois app.py (qui passent desormais service= a chaque appel de
# metrique). Monte via ConfigMap + volumeMount subPath, sans reconstruire les
# images.
#
#   kubectl apply -f manifests/27-boutique-metriques-generiques.yaml
#   # puis les 3 patchs de montage (voir plus bas), OU les kubectl patch fournis
#
# Cette ConfigMap remplace le patch precedent 26-observability-trace-id.yaml :
# le observability.py inclus ici contient DEJA l'injection du trace_id. Ne pas
# monter les deux en meme temps sur le meme fichier.
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-patch
  namespace: production
data:
  observability.py: |
    """
    common — briques d'observabilité partagées par les trois services.

    Ce module factorise tout ce qui concerne l'observabilité :
      - la configuration des logs structurés au format JSON (collectés par Alloy -> Loki),
        enrichis du trace_id / span_id du contexte de trace courant ;
      - la création des métriques Prometheus exposées sur /metrics ;
      - la réponse standard de l'endpoint /metrics.

    VERSION GÉNÉRIQUE : les métriques ne sont plus prefixees par le nom du service
    (worker_/api_/frontend_). Elles portent un nom commun (http_requests_total,
    http_request_duration_seconds) et le service est un LABEL. Cela rend les
    requetes portables : une seule requete, groupee ou filtree par le label
    `service`, vaut pour tous les services — et pour tout service ajoute plus tard.
    Le service est passe explicitement a chaque appel dans les app.py.
    """

    import json
    import logging
    import sys

    from opentelemetry import trace

    from prometheus_client import (
        Counter,
        Histogram,
        generate_latest,
        CONTENT_TYPE_LATEST,
    )


    def make_logger(service_name):
        """Construit un logger qui émet une ligne JSON par événement sur stdout.

        Chaque ligne contient l'horodatage, le niveau, le service, le message, les
        champs métier (order_id, amount) s'ils sont fournis, et le trace_id /
        span_id du span courant s'il existe (corrélation logs <-> traces).
        """

        class JsonFormatter(logging.Formatter):
            def format(self, record):
                entry = {
                    "timestamp": self.formatTime(record),
                    "level": record.levelname,
                    "service": service_name,
                    "message": record.getMessage(),
                }
                for field in ("order_id", "amount"):
                    if hasattr(record, field):
                        entry[field] = getattr(record, field)

                span = trace.get_current_span()
                ctx = span.get_span_context()
                if ctx.is_valid:
                    entry["trace_id"] = format(ctx.trace_id, "032x")
                    entry["span_id"] = format(ctx.span_id, "016x")

                return json.dumps(entry, ensure_ascii=False)

        handler = logging.StreamHandler(sys.stdout)
        handler.setFormatter(JsonFormatter())

        logger = logging.getLogger(service_name)
        logger.setLevel(logging.INFO)
        logger.handlers.clear()
        logger.addHandler(handler)
        logger.propagate = False
        return logger


    def make_metrics():
        """Crée les deux métriques GÉNÉRIQUES, partagées par tous les services.

        - http_requests_total : compteur de requetes, labels `service` et `status` ;
        - http_request_duration_seconds : histogramme de duree, label `service`.

        Le service n'est PAS pré-rempli : chaque app.py le passe explicitement a
        l'usage, par exemple REQUESTS.labels(service="worker", status="failed").inc().
        Un seul process par service (un pod chacun), donc pas de conflit de registre.
        """
        requests = Counter(
            "http_requests_total",
            "Nombre total de requetes traitees",
            ["service", "status"],
        )
        latency = Histogram(
            "http_request_duration_seconds",
            "Duree de traitement d'une requete en secondes",
            ["service"],
        )
        return requests, latency


    def metrics_response():
        """Renvoie l'exposition Prometheus, prête à être servie par Flask."""
        return generate_latest(), 200, {"Content-Type": CONTENT_TYPE_LATEST}

  worker-app.py: |
    """
    worker — traitement du paiement.

    Recoit une demande de paiement depuis 'api' (POST /payment) et simule un
    echange avec une banque : la plupart des paiements sont rapides, mais une
    partie est volontairement lente, et un sur dix echoue. C'est ce service qui
    fournit la matiere a diagnostiquer (trace lente, log d'erreur, latence qui
    grimpe) au fil du cours.

    Signaux d'observabilite exposes :
      - metriques Prometheus sur /metrics (http_requests_total, http_request_duration_seconds,
        labellisees par le service)
      - logs structures JSON sur stdout
      - traces : ajoutees par instrumentation automatique (voir le Dockerfile)
    """

    import random
    import time

    from flask import Flask, request, jsonify

    from observability import make_logger, make_metrics, metrics_response

    # Nom du service, defini une seule fois et reutilise pour le logger et le
    # label `service` des metriques.
    SERVICE = "worker"

    # Probabilites de simulation, regroupees en tete pour etre faciles a ajuster
    # en demonstration.
    PROBA_LENT = 0.2        # part des paiements volontairement lents
    PROBA_ECHEC = 0.1       # part des paiements refuses

    logger = make_logger(SERVICE)
    REQUESTS, LATENCY = make_metrics()

    app = Flask(__name__)


    @app.route("/payment", methods=["POST"])
    def payment():
        data = request.get_json(silent=True) or {}
        order_id = data.get("order_id", "inconnu")
        amount = data.get("amount", 0)

        with LATENCY.labels(service=SERVICE).time():
            # Latence variable : banque rapide la plupart du temps, lente parfois.
            if random.random() < PROBA_LENT:
                time.sleep(random.uniform(1.0, 3.0))
            else:
                time.sleep(random.uniform(0.05, 0.3))

            # Echec occasionnel : la banque refuse le paiement.
            if random.random() < PROBA_ECHEC:
                REQUESTS.labels(service=SERVICE, status="failed").inc()
                logger.error(
                    "Paiement refuse par la banque",
                    extra={"order_id": order_id, "amount": amount},
                )
                return jsonify({"status": "failed", "order_id": order_id}), 502

        REQUESTS.labels(service=SERVICE, status="success").inc()
        logger.info(
            "Paiement accepte",
            extra={"order_id": order_id, "amount": amount},
        )
        return jsonify({"status": "success", "order_id": order_id}), 200


    @app.route("/metrics")
    def metrics():
        return metrics_response()


    @app.route("/health")
    def health():
        return jsonify({"status": "ok"}), 200


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8083)

  api-app.py: |
    """
    api — validation de la commande et verification du stock.

    Recoit la commande depuis 'frontend' (POST /orders), verifie un stock
    simule, puis demande le paiement au service 'worker'. Maillon central de
    la chaine : son span s'intercale entre celui du frontend et celui du worker.

    Signaux d'observabilite exposes :
      - metriques Prometheus sur /metrics (labellisees par le service)
      - logs structures JSON sur stdout
      - traces : ajoutees par instrumentation automatique (voir le Dockerfile)
    """

    import os

    import requests
    from flask import Flask, request, jsonify

    from observability import make_logger, make_metrics, metrics_response

    # Nom du service, defini une seule fois.
    SERVICE = "api"

    # URL du service worker, injectee par l'environnement.
    WORKER_URL = os.environ.get("WORKER_URL", "http://localhost:8083")

    # Stock simule : quantite disponible par article.
    STOCK = {"clavier": 50, "souris": 80, "ecran": 12, "casque": 0}

    logger = make_logger(SERVICE)
    REQUESTS, LATENCY = make_metrics()

    app = Flask(__name__)


    @app.route("/orders", methods=["POST"])
    def orders():
        data = request.get_json(silent=True) or {}
        order_id = data.get("order_id", "inconnu")
        cart = data.get("cart", [])

        with LATENCY.labels(service=SERVICE).time():
            # Verification de stock : un article absent ou epuise rejette la commande.
            for item in cart:
                if STOCK.get(item, 0) <= 0:
                    REQUESTS.labels(service=SERVICE, status="out_of_stock").inc()
                    logger.error(
                        "Article indisponible",
                        extra={"order_id": order_id},
                    )
                    return jsonify({"status": "out_of_stock", "item": item}), 409

            amount = len(cart) * 25  # montant simule
            logger.info(
                "Commande validee, demande de paiement",
                extra={"order_id": order_id, "amount": amount},
            )
            try:
                response = requests.post(
                    f"{WORKER_URL}/payment",
                    json={"order_id": order_id, "amount": amount},
                    timeout=10,
                )
            except requests.RequestException:
                REQUESTS.labels(service=SERVICE, status="failed").inc()
                logger.error("Service worker injoignable", extra={"order_id": order_id})
                return jsonify({"status": "error", "order_id": order_id}), 503

        if response.status_code == 200:
            REQUESTS.labels(service=SERVICE, status="success").inc()
            return jsonify({"status": "ok", "order_id": order_id}), 200

        REQUESTS.labels(service=SERVICE, status="payment_failed").inc()
        logger.error("Paiement echoue", extra={"order_id": order_id})
        return jsonify({"status": "payment_failed", "order_id": order_id}), 502


    @app.route("/metrics")
    def metrics():
        return metrics_response()


    @app.route("/health")
    def health():
        return jsonify({"status": "ok"}), 200


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8082)

  frontend-app.py: |
    """
    frontend — point d'entree de la boutique.

    Recoit la commande du client (POST /checkout avec un panier), puis
    transmet la commande au service 'api'. C'est le premier maillon de la
    chaine : c'est ici que naitra la trace qui suivra la commande jusqu'au
    paiement.

    Signaux d'observabilite exposes :
      - metriques Prometheus sur /metrics (labellisees par le service)
      - logs structures JSON sur stdout
      - traces : ajoutees par instrumentation automatique (voir le Dockerfile)
    """

    import os

    import requests
    from flask import Flask, request, jsonify

    from observability import make_logger, make_metrics, metrics_response

    # Nom du service, defini une seule fois.
    SERVICE = "frontend"

    # URL du service api, injectee par l'environnement (valeur par defaut locale).
    API_URL = os.environ.get("API_URL", "http://localhost:8082")

    logger = make_logger(SERVICE)
    REQUESTS, LATENCY = make_metrics()

    app = Flask(__name__)


    @app.route("/checkout", methods=["POST"])
    def checkout():
        data = request.get_json(silent=True) or {}
        cart = data.get("cart", [])
        order_id = data.get("order_id", "inconnu")

        with LATENCY.labels(service=SERVICE).time():
            logger.info(
                "Commande recue du client",
                extra={"order_id": order_id},
            )
            try:
                # L'appel HTTP propage automatiquement le contexte de trace
                # (en-tete traceparent) une fois l'instrumentation activee.
                response = requests.post(
                    f"{API_URL}/orders",
                    json={"order_id": order_id, "cart": cart},
                    timeout=10,
                )
            except requests.RequestException:
                REQUESTS.labels(service=SERVICE, status="failed").inc()
                logger.error("Service api injoignable", extra={"order_id": order_id})
                return jsonify({"status": "error", "order_id": order_id}), 503

        if response.status_code == 200:
            REQUESTS.labels(service=SERVICE, status="success").inc()
            return jsonify({"status": "confirmed", "order_id": order_id}), 200

        REQUESTS.labels(service=SERVICE, status="failed").inc()
        logger.error("Commande refusee en aval", extra={"order_id": order_id})
        return jsonify({"status": "rejected", "order_id": order_id}), 502


    @app.route("/metrics")
    def metrics():
        return metrics_response()


    @app.route("/health")
    def health():
        return jsonify({"status": "ok"}), 200


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8081)
