# =============================================================================
# Grafana Alloy — VARIANTE AVEC FILTRAGE DES TRACES /metrics
# =============================================================================
#   helm upgrade alloy grafana/alloy -n monitoring \
#     -f manifests/32-alloy-values-filtre.yaml
#
# Cette variante reprend le fichier 32-alloy-values.yaml et y ajoute UN SEUL
# element : un processor de filtrage dans le pipeline des traces, qui rejette
# les spans du scraping /metrics (le bruit d'auto-surveillance decrit au
# chapitre traces). Le pipeline devient : recepteur -> FILTRE -> exportateur.
#
# On garde les deux fichiers : 32-alloy-values.yaml (pipeline simple, pour le
# deroule du cours) et celui-ci (pipeline enrichi, pour montrer le processor du
# Collector en action, chapitre OpenTelemetry). On applique l'un OU l'autre.
#
# ATTENTION — otelcol.processor.filter agit span par span, pas trace par trace.
# Ici c'est sans risque : le span GET /metrics est un span isole (le scrape
# Prometheus ne cree pas d'enfants), donc le filtrer ne laisse aucun orphelin.
# Pour filtrer un span PARENT (qui a des enfants), il faudrait au contraire
# otelcol.processor.tail_sampling, qui decide au niveau de la trace entiere.
# =============================================================================

controller:
  # DaemonSet : indispensable pour la collecte de logs, afin qu'un agent tourne
  # sur chaque noeud et lise les logs locaux de ce noeud.
  type: daemonset

alloy:
  # Ressources volontairement modestes (formation).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Montages necessaires pour lire les logs des conteneurs sur le noeud hote.
  mounts:
    # Monte /var/log de l'hote : Alloy y trouve les logs des pods.
    varlog: true

  # Ports OTLP exposes pour la reception des traces, ajoutes au Service Alloy
  # afin que la boutique puisse joindre alloy.monitoring:4317 (gRPC) / :4318.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  # -------------------------------------------------------------------------
  # Configuration Alloy (langage River). Definit le pipeline de collecte :
  #   1. decouvrir les pods du cluster
  #   2. les relabeliser (ajouter namespace, pod, container, app...)
  #   3. lire leurs fichiers de log
  #   4. traiter (extraire le niveau, etc.)
  #   5. ecrire vers Loki
  # -------------------------------------------------------------------------
  configMap:
    content: |-
      // ---- Sortie : ou envoyer les logs -------------------------------------
      // loki.write definit la destination : la gateway Loki, qui route vers le
      // distributor. C'est le point d'entree d'ecriture de Loki.
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

      // ---- Decouverte : quels pods observer ---------------------------------
      // discovery.kubernetes surveille l'etat du cluster et maintient a jour la
      // liste des pods en cours d'execution.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // ---- Relabeling : enrichir les cibles avec des labels Kubernetes ------
      // Transforme les metadonnees Kubernetes en labels de log exploitables
      // dans LogQL (namespace, pod, container, app, noeud).
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // namespace
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        // nom du pod
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        // nom du conteneur
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // label applicatif (app=frontend / api / worker pour la boutique)
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        // noeud hote
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
        // chemin du fichier de log a lire (requis par loki.source.kubernetes)
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      // ---- Lecture : recuperer le contenu des logs --------------------------
      // loki.source.kubernetes lit les logs des conteneurs decouverts via
      // l'API Kubernetes, sans dependre du format de fichier sur disque.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.add_level.receiver]
      }

      // ---- Traitement : extraire le niveau de log ---------------------------
      // loki.process applique des etapes de transformation. Ici, on detecte le
      // niveau (info/warn/error) et on l'expose en label structure.
      loki.process "add_level" {
        forward_to = [loki.write.default.receiver]

        // Tente d'extraire un champ "level" d'un log JSON (cas de la boutique,
        // dont les logs sont structures en JSON).
        stage.json {
          expressions = {
            level = "level",
          }
        }
        // Promeut le niveau detecte en label.
        stage.labels {
          values = {
            level = "",
          }
        }
      }

      // =======================================================================
      // PIPELINE DES TRACES (chapitre 4)
      // La boutique, instrumentee automatiquement avec OpenTelemetry, envoie ses
      // traces a Alloy au format OTLP. Alloy les recoit puis les transmet a
      // Tempo. C'est le meme principe que pour les logs : Alloy est le point de
      // collecte unique, qui route chaque signal vers son backend.
      // =======================================================================

      // ---- Reception : ecouter les traces OTLP ------------------------------
      // otelcol.receiver.otlp ouvre deux points d'entree : gRPC (port 4317) et
      // HTTP (port 4318). SEULE DIFFERENCE avec le fichier simple : la sortie
      // ne va plus directement a l'exportateur, mais D'ABORD au filtre.
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.filter.drop_metrics.input]
        }
      }

      // ---- Filtre : rejeter les spans du scraping /metrics ------------------
      // otelcol.processor.filter evalue une condition OTTL sur CHAQUE span : si
      // la condition est vraie, le span est rejete (drop). Ici, on rejette les
      // spans dont l'URL cible est /metrics — le bruit du scrape Prometheus.
      //
      // La condition teste deux noms d'attribut possibles selon la version de
      // l'instrumentation : url.path (conventions HTTP stables) et http.target
      // (ancienne convention). IsMatch permet un test souple.
      //
      // error_mode = "ignore" : si un span n'a pas l'attribut teste, on ignore
      // l'erreur et on garde le span (on ne filtre que ce qui matche vraiment).
      otelcol.processor.filter "drop_metrics" {
        error_mode = "ignore"
        traces {
          span = [
            "attributes[\"url.path\"] == \"/metrics\"",
            "attributes[\"http.target\"] == \"/metrics\"",
          ]
        }
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // ---- Export : pousser les traces (filtrees) vers Tempo ----------------
      // Inchange par rapport au fichier simple : envoi a la passerelle de
      // distribution de Tempo, port OTLP gRPC 4317, liaison interne en clair.
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo-distributor.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

# RBAC : Alloy a besoin de lire les pods du cluster pour les decouvrir.
rbac:
  create: true

serviceAccount:
  create: true
